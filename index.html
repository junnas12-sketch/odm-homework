/* 오늘도수학 숙제 서식: 네이비 글씨, 작은 주황 포인트, 포스터 글꼴은 숫자와 제목에만 */
:root{
  --bg:#f5f6fa; --card:#ffffff; --fg:#0e1640; --muted:#5b6280; --line:#e3e5ee; --line2:#edeff6;
  --accent:#0e1640; --accent-soft:#e9ebf5; --accent-fg:#ffffff; --accent-text:#2b3468;
  --orange:#fd5c00; --or-soft:#fff0e6; --or-text:#a64000; --or-line:#fcc7a4;
  --ok:#2b3468; --ok-soft:#e9ebf5; --bad:#8a3300; --bad-soft:#fde3d3; --warn:#a64000; --warn-soft:#fff0e6;
  --om-line:#8f95b4;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --disp:'Black Han Sans','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b1030; --card:#141a42; --fg:#e8eaf6; --muted:#a3a9cc; --line:#2a3166; --line2:#222956;
  --accent:#e8eaf6; --accent-soft:#232a5c; --accent-fg:#0b1030; --accent-text:#cdd1ef;
  --orange:#ff7a2e; --or-soft:#3a2418; --or-text:#ffb68a; --or-line:#7a4524;
  --ok:#cdd1ef; --ok-soft:#232a5c; --bad:#ffb68a; --bad-soft:#4a2a18; --warn:#ffb68a; --warn-soft:#3a2418;
  --om-line:#6c74a8; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;padding:0 max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:14px 0 60px}
.bh{font-family:var(--disp);font-weight:400}
.wm{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.wm i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;margin-bottom:14px}
.brand{font-family:var(--disp);font-size:20px}
.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin-right:7px;vertical-align:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.phone{max-width:430px;margin:0 auto;background:var(--bg);border:0.5px solid var(--line);border-radius:22px;overflow:hidden;min-height:620px;display:flex;flex-direction:column;position:relative}
.phone-h{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pb{padding:4px 12px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.ptitle{font-family:var(--disp);font-size:26px;line-height:1.15;padding:4px 4px 2px}
.who{font-size:12px;color:var(--muted);padding:0 4px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:2px 4px}
.bar i{display:block;height:4px;background:var(--orange);border-radius:2px}
.hw{background:var(--card);border:0.5px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
.hw.past{background:transparent;border-style:dashed}
.hw .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hw h3{margin:0;font-family:var(--disp);font-weight:400;font-size:20px}
.meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);border:0;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{border:0;background:var(--accent);color:var(--accent-fg);padding:12px 16px;border-radius:10px;font-weight:700;width:100%}
.btn.sec{background:var(--accent-soft);color:var(--accent-text)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
/* 답안지 */
.sheet{background:var(--card);border:0.5px solid var(--line);border-radius:14px;padding:4px 12px}
.sr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--line2)}
.sr:last-child{border-bottom:0}
.sr .qn{font-family:var(--disp);font-size:19px;min-width:34px;line-height:1}
.om{display:flex;gap:6px}
.om button{width:32px;height:44px;border-radius:50%;border:1.2px solid var(--om-line);background:var(--card);font-size:13px;font-weight:500;color:var(--muted);padding:0}
.om button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sr input[type=text]{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--accent);border-radius:0;background:transparent;padding:6px 2px;font-size:17px}
.sr input[type=text]::placeholder{color:var(--muted);opacity:.6;font-size:14px}
.sr.chkr{cursor:default}
.sr.chkr span.t{flex:1;font-size:13px;color:var(--muted)}
.sr.chkr input{width:20px;height:20px;accent-color:var(--accent)}
.sr.multi{align-items:flex-start}
.mi{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:8px}
.mrow .ml{font-size:12px;color:var(--muted);min-width:38px;max-width:110px;line-height:1.25}
.mrow input[type=text]{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--accent);border-radius:0;background:transparent;padding:5px 2px;font-size:16px}
.keys{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}
.keys button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:14px}
.pager{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:0 4px}
.nav2{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.nav2 .btn.line{flex:1}.nav2 .btn:not(.line){flex:2}
/* 결과 */
.res{padding:6px 4px}
.res .big{font-family:var(--disp);font-size:56px;line-height:1}
.res .big small{font-size:28px;color:var(--muted)}
.res .ul{height:3px;width:36px;background:var(--orange);margin-top:7px}
.msg{font-size:13px;color:var(--accent-text);padding:2px 4px}
.rl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 2px}
.rl span{height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.rl .o{background:var(--accent-soft);color:var(--accent-text)}
.rl .x{background:var(--or-soft);color:var(--or-text);border:1px solid var(--or-line)}
.rl .c{background:transparent;color:var(--muted);border:1px dashed var(--om-line)}
/* 제출 확인 */
.cover{position:absolute;inset:0;background:rgba(10,14,40,.45);display:flex;align-items:flex-end;z-index:5}
.sheetup{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px 18px;display:flex;flex-direction:column;gap:8px}
.sheetup h3{margin:0;font-family:var(--disp);font-weight:400;font-size:22px}
.sheetup .row2{display:flex;gap:8px;margin-top:6px}
.sheetup .row2 .btn{flex:1}
/* 선생님 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.panel{background:var(--card);border:0.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:16px;font-weight:700}
.panel h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:110px}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.classes{display:flex;flex-wrap:wrap;gap:8px}
.classes label{display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.classes input{width:auto}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;border-bottom-color:var(--line)}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent-soft)}
.box{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw}
.det div.r{display:grid;grid-template-columns:40px 1fr 110px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);overflow-wrap:anywhere}
.center{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.center h1{margin:0;font-family:var(--disp);font-weight:400;font-size:28px}
.center .tabs button{flex:1}
@media (max-width:480px){
  body{padding:0}
  .wrap{padding:0}
  .phone{border:0;border-radius:0;min-height:100vh;max-width:none}
  .center{margin:24px 16px}
}
/* 학생 학습 이력 */
.stb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px;margin:0 6px 6px 0}
.stb small{color:var(--muted);margin-left:4px}
.stb.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stb.on small{color:var(--accent-fg);opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--or-line);background:var(--or-soft);color:var(--or-text);border-radius:99px;padding:1px 9px;font-size:12px}
.chips button.off{background:transparent;border-color:var(--line);color:var(--muted);text-decoration:line-through}
.svrow td{vertical-align:top;white-space:normal}
.svrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
/* 그래프 */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl .seg{display:flex;gap:6px;flex-wrap:wrap}
.ctl .seg button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;font-size:13px;color:var(--muted)}
.ctl .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ctl select{width:auto;padding:6px 10px;font-size:14px}
.hb{display:grid;grid-template-columns:72px 1fr 92px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{position:relative;height:16px;background:var(--line2);border-radius:8px;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:8px}
.hb .tr2{height:5px;background:var(--line2);border-radius:3px;margin-top:3px;overflow:hidden}
.hb .tr2 i{display:block;height:5px;background:var(--orange)}
.hb .vl{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.hg{font-size:12px;color:var(--muted);padding:4px 0 2px;display:flex;gap:14px;align-items:center}
.hg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding:6px 2px 0}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.cols .c span.v{font-size:11px;color:var(--muted);margin-bottom:3px}
.cols .c i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
.cols .c i.cur{background:var(--orange)}
.cols .c span.w{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap}
/* 오답 노트 (오늘도수학 합본 서식) */
.np{position:relative;width:793.7px;height:1122.5px;background:#fff;color:#000;margin:0 auto 18px;border:1px solid #d6d4dc;overflow:hidden;font-family:'Noto Sans KR',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.np .abs{position:absolute}
.np .hp{left:53px;top:32px;width:253px;height:29px;border-radius:15px;background:#b8aed6;color:#fff;font-size:17px;line-height:29px;padding-left:16px;white-space:nowrap}
.np .ho{right:53px;top:36px;width:109px;height:22px;border:0.7px solid #b3b3b3;border-radius:12px;color:#595959;font-size:11px;line-height:21px;text-align:center}
.np .hl{left:313px;right:170px;top:47px;border-top:0.7px solid #d1d1d1}
.np .dv{left:396.8px;top:87px;bottom:61px;border-left:0.7px solid #cccccc}
.np .pn{left:0;right:0;bottom:26px;text-align:center;font-size:11px;color:#737373}
.np .gl{font-size:11.5px}
.np .sn{font-size:16px;font-weight:500}
.np .sn.big{font-size:14px}
.np .tg{font-size:10px;color:#666;white-space:nowrap}
.np .at{font-size:20px;font-weight:500}
.np img{position:absolute;display:block}
.note-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.note-page{background:#fff;color:#000;padding:0}
.note-h{font-weight:700;font-size:15px;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px}
.note-cols{column-count:2;column-gap:10mm}
.note-q{break-inside:avoid;margin-bottom:6mm}
.note-q b{font-size:14px;display:block;margin-bottom:2mm}
.note-q img{max-width:100%;display:block}
.note-q .tg{font-size:9px;color:#666;text-align:right}
.note-sec{break-before:page;margin-top:0}
@media print{
  @page{size:A4;margin:0}
  html,body{margin:0;padding:0;background:#fff}
  body{padding:0!important}
  .wrap>.top,.note-bar,.noteinfo,.toast{display:none!important}
  .wrap{padding:0!important;margin:0!important;max-width:none!important}
  .np{margin:0!important;border:0!important;height:1118px;box-sizing:border-box;page-break-after:always;break-after:page}
  .np:last-of-type{page-break-after:auto;break-after:auto}
}
</style>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200);}
function fmt(ts){
  const parts=d=>{const p=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);const o={};p.forEach(x=>o[x.type]=x.value);return o;};
  const d=new Date(ts), p=parts(d);
  if((p.hour==='24'||p.hour==='00')&&p.minute==='00'){const q=parts(new Date(d.getTime()-1000));return `${q.month}월 ${q.day}일 밤 12시`;}
  return `${p.month}월 ${p.day}일 ${p.hour}:${p.minute}`;
}
function seoulToday(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());return p;}  // YYYY-MM-DD
function midnightOf(dateStr,plusDays){return new Date(new Date(dateStr+'T00:00:00+09:00').getTime()+864e5*(1+(plusDays||0))).toISOString();}
const ERR = {bad_login:'이름이나 번호가 맞지 않아요.', locked:'여러 번 틀려서 잠시 잠겼어요. 15분 뒤에 다시 해 주세요.', no_session:'다시 로그인해 주세요.',
  already_done:'이미 제출한 숙제예요.', not_found:'이 숙제를 찾을 수 없어요.', gone:'지난 교재라 더 풀 수 없어요.', not_late:'아직 마감 전이에요.', ext_used:'이번 달 미루기는 이미 썼어요.',
  bad_pin:'번호는 숫자 4~6자리로 적어 주세요.', not_teacher:'선생님 로그인이 필요해요.', bad_code:'초대 코드가 맞지 않거나 이미 쓴 코드예요.', not_your_class:'맡은 반이 아니에요.', not_admin:'관리자만 할 수 있어요.', self_delete:'자기 자신은 지울 수 없어요.'};
function errMsg(e){const m=(e&&e.message)||String(e); if(/row-level security/i.test(m)) return '이 작업을 할 권한이 없어요. 담당 반이 맞는지 관리자에게 확인해 주세요.'; if(/foreign key/i.test(m)) return '연결된 정보가 있어서 처리할 수 없어요. 학생이 있는 반은 학생을 먼저 옮기거나 지워 주세요.'; for(const k in ERR) if(m.includes(k)) return ERR[k]; return '문제가 생겼어요: '+m;}
async function must(p){const r=await p; if(r.error) throw r.error; return r.data;}

if(!window.ODM || /여기에/.test(ODM.url)){
  document.getElementById('app').innerHTML='<div class="center"><h1>설정이 필요해요</h1><div class="box">web/config.js 파일에 Supabase 프로젝트 주소와 공개 키를 넣어 주세요. 설치방법.md의 3번을 따라 하면 돼요.</div></div>';
  throw new Error('config');

const GRADED = t => t==='객관식' || t==='단답';
const isAuto = it => GRADED(it.type) || (it.type==='복수답' && !!it.parts);
/* 복수답 정답 문자열을 칸 목록으로 나눔 (서버에 저장된 방식과 같은 규칙) */
const UNIT_RE = '(?:m/s²|m/s|cm³|cm²/s|cm²|cm|kg|m|원)';
function parseParts(ans){
  ans=String(ans||'').trim(); let groups;
  if(/또는|○|×|\||:/.test(ans)) return null;
  const MK=/((?<![A-Za-z0-9가-힣)])\(\d+\)(?=\s|$))/;
  if(MK.test(ans)){
    const pieces=ans.split(MK); groups=[];
    if(pieces[0].trim()) return null;
    for(let i=1;i<pieces.length;i+=2) groups.push([pieces[i],(pieces[i+1]||'').trim()]);
  } else groups=[['',ans]];
  const hangul=/[가-힣]/, unitEnd=new RegExp(UNIT_RE+'$'); const parts=[];
  for(const [g,text] of groups){
    if(!text) return null;
    // 괄호와 중괄호 안의 쉼표는 그대로 두고, 바깥의 쉼표에서만 나눔
    const subs=[]; let depth=0, cur='';
    for(let i=0;i<text.length;i++){ const ch=text[i];
      if('({['.includes(ch)) depth++; else if(')}]'.includes(ch)) depth--;
      if(depth===0 && ch===','){ subs.push(cur.trim()); cur=''; continue; }
      cur+=ch; }
    subs.push(cur.trim());
    let last=null;
    for(const sp of subs){ if(!sp) return null;
      let lab='',val=sp,labeled=false;
      const am=sp.match(/^([A-Za-z](?:\([a-z0-9]\))?)\s*=\s*(\S.*)$/);
      const hm=sp.match(/^([가-힣][가-힣 ]*?)\s+([^가-힣\s].*)$/);
      if(am && !hangul.test(am[2].replace(unitEnd,''))){ lab=am[1]; val=am[2].trim(); labeled=true; }
      else if(hm){ lab=hm[1].trim(); val=hm[2].trim(); labeled=true; }
      else if(/^[a-z]\s*[<>≤≥]/.test(sp)) return null;
      if(!labeled && last){ last.value+=', '+val; continue; }
      last=labeled?{label:(g+' '+lab).trim(),value:val}:null;
      parts.push(last||{label:g,value:val});
    }
  }
  if(parts.length<2) return null;
  if(!groups.some(x=>x[0]) && parts.every(q=>!q.label)){ parts.forEach((q,i)=>{q.label='빈칸 '+(i+1);}); }
  for(const q of parts){ const v=q.value;
    if((v.match(/\(/g)||[]).length!==(v.match(/\)/g)||[]).length || (v.match(/\{/g)||[]).length!==(v.match(/\}/g)||[]).length || /^[\/\-−]+$/.test(v) || v==='') return null;
    if((v.match(/[가-힣]/g)||[]).length>6) return null; }
  for(const [g] of groups){ if(!g) continue; const same=parts.filter(q=>q.label===g); if(same.length>1) same.forEach((q,i)=>{q.label=g+' '+(i+1)+'번째 답';}); }
  return parts;
}

/* 오늘도수학 합본 서식 배치: A4, 보라 타원 머리글, 2단 가는 세로선, 한 쪽 4칸, 쪽번호, 뒤쪽 정답과 해설.
   배치 결과를 명령 목록으로 만들어 화면(HTML)과 PDF(캔버스)가 똑같이 쓴다. 좌표는 96dpi 픽셀, y는 글자 윗선 */
const NP={PW:793.7,PH:1122.5,MX:53,MT:93,MB:61,GUT:24,NUMW:35,S:0.48};
function noteLayout(n){
  const {PW,PH,MX,MT,MB,GUT,NUMW,S}=NP; const CW=(PW-2*MX-GUT)/2, SLOT=(PH-MT-MB)/2, colX=[MX,MX+CW+GUT];
  const pages=[]; let cur=null; const newPage=()=>{cur=[];pages.push(cur);return cur;};
  const sz=(p,maxW,maxH)=>{ const d=n.dims[p]; if(!d) return null; let w=d[0]*S,h=d[1]*S; if(w>maxW){h*=maxW/w;w=maxW;} if(h>maxH){w*=maxH/h;h=maxH;} return {w,h}; };
  const used=new Set(); let slot=4; const order=[[0,0],[0,1],[1,0],[1,1]];
  n.entries.forEach((e,i)=>{
    const p=`${e.book_id}/${e.num}.png`; const tag=e.tag||'';
    let box=sz(p,CW-NUMW,SLOT-46)||{w:CW-NUMW,h:40}; let span2=false; const d=n.dims[p];
    if(d && d[1]*S*Math.min(1,(CW-NUMW)/(d[0]*S))>SLOT-46){ span2=true; box=sz(p,CW-NUMW,2*SLOT-60); }
    while(true){
      if(!cur||slot>=4){ newPage(); used.clear(); slot=0; }
      const [c,r]=order[slot];
      if(used.has(c+','+r)){slot++;continue;}
      if(span2&&(r===1||used.has(c+',1'))){slot++;continue;}
      break;
    }
    const [c,r]=order[slot]; const x0=colX[c], y0=MT+r*SLOT;
    if(e.newGroup) cur.push({k:'t',x:x0,y:y0,s:`[${e.title}]`,fs:11.5,w:400,c:'#000'});
    cur.push({k:'t',x:x0,y:y0+18,s:`${i+1}.`,fs:16,w:500,c:'#000'});
    if(n.url[p]) cur.push({k:'i',src:n.url[p],x:x0+NUMW,y:y0+24,w:box.w,h:box.h});
    else cur.push({k:'t',x:x0+NUMW,y:y0+24,s:'문제 이미지가 없어요',fs:10,w:400,c:'#666'});
    cur.push({k:'t',x:x0+CW-6-tag.length*6.2,y:y0+24+box.h+4,s:tag,fs:10,w:400,c:'#666'});
    used.add(c+','+r); if(span2) used.add(c+',1'); slot++;
  });
  cur=newPage(); cur.push({k:'t',x:MX,y:MT+2,s:'정답과 해설',fs:20,w:500,c:'#000'});
  let col=0; const ys=[MT+40,MT]; const bottom=PH-MB;
  n.entries.forEach((e,i)=>{
    const p=`${e.book_id}/${e.num}_a.png`;
    const box=n.url[p]?sz(p,CW-NUMW,bottom-MT-30):null; const hgt=(box?box.h:34)+19;
    if(ys[col]+hgt>bottom){ if(col===0) col=1; else { cur=newPage(); col=0; ys[0]=MT; ys[1]=MT; } }
    const x0=colX[col];
    cur.push({k:'t',x:x0,y:ys[col],s:`${i+1}.`,fs:16,w:500,c:'#000'});
    if(box) cur.push({k:'i',src:n.url[p],x:x0+NUMW,y:ys[col],w:box.w,h:box.h});
    else cur.push({k:'t',x:x0+NUMW,y:ys[col]+3,s:`정답 ${e.answer||''}`,fs:13,w:400,c:'#000'});
    ys[col]+=hgt;
  });
  return pages;
}
function noteHTML(){
  const n=Te.note; const pages=noteLayout(n);
  const html=pages.map((cmds,pi)=>`<div class="np">
    <div class="abs hp">오답 노트  ${esc(n.name)}</div><div class="abs ho">오늘도수학</div><div class="abs hl"></div><div class="abs dv"></div>
    ${cmds.map(c=>c.k==='t'?`<div class="abs" style="left:${c.x}px;top:${c.y}px;font-size:${c.fs}px;font-weight:${c.w};color:${c.c};line-height:1;white-space:nowrap">${esc(c.s)}</div>`
      :`<img src="${c.src}" alt="" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px">`).join('')}
    <div class="abs pn">${pi+1}</div></div>`).join('');
  return `<div class="note-bar"><button class="btn sm" id="npdf">PDF로 만들기 (추천)</button><button class="btn sm line" onclick="window.print()">바로 인쇄</button><button class="btn sm line" id="nclose">돌아가기</button></div>
   <div class="meta noteinfo" style="margin-bottom:10px">틀린 ${n.entries.length}문항, ${pages.length}쪽. 폰이나 태블릿에서는 "PDF로 만들기"로 저장해서 인쇄하면 A4에 정확히 맞아요.</div>${html}`;

function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function drawNotePage(g,K,cmds,pi,name,bmp){
  const {PW,PH,MX,MT,MB}=NP; g.setTransform(K,0,0,K,0,0); g.fillStyle='#fff'; g.fillRect(0,0,PW,PH); g.textBaseline='top';
  const F=(w,fs)=>`${w} ${fs}px "Noto Sans KR", sans-serif`;
  g.fillStyle='#b8aed6'; rr(g,53,32,253,29,14.5); g.fill();
  g.fillStyle='#fff'; g.font=F(400,17); g.fillText('오답 노트  '+name,53+16,32+6);
  g.strokeStyle='#b3b3b3'; g.lineWidth=0.7; rr(g,PW-53-109,36,109,22,11); g.stroke();
  g.fillStyle='#595959'; g.font=F(400,11); g.textAlign='center'; g.fillText('오늘도수학',PW-53-109/2,36+5); g.textAlign='left';
  g.strokeStyle='#d1d1d1'; g.beginPath(); g.moveTo(313,47); g.lineTo(PW-170,47); g.stroke();
  g.strokeStyle='#cccccc'; g.beginPath(); g.moveTo(PW/2,87); g.lineTo(PW/2,PH-61); g.stroke();
  cmds.forEach(c=>{ if(c.k==='t'){ g.fillStyle=c.c; g.font=F(c.w,c.fs); g.fillText(c.s,c.x,c.y); } else { const bm=bmp[c.src]; if(bm) g.drawImage(bm,c.x,c.y,c.w,c.h); } });
  g.fillStyle='#737373'; g.font=F(400,11); g.textAlign='center'; g.fillText(String(pi+1),PW/2,PH-26-11); g.textAlign='left';
}
async function makeNotePdf(){
  const n=Te.note; if(!n) return;
  if(!window.jspdf){ toast('PDF 도구를 불러오지 못했어요. 새로고침하고 다시 눌러 주세요.'); return; }
  const btn=$('#npdf'); if(btn) btn.disabled=true; toast('PDF를 만드는 중이에요. 잠시만 기다려 주세요...');
  try{
    try{ await document.fonts.load('400 16px "Noto Sans KR"'); await document.fonts.load('500 16px "Noto Sans KR"'); }catch(e){}
    const pages=noteLayout(n); const K=2.4, W=Math.round(NP.PW*K), H=Math.round(NP.PH*K);
    const urls=[...new Set(pages.flat().filter(c=>c.k==='i').map(c=>c.src))]; const bmp={};
    await Promise.all(urls.map(async u=>{ const r=await fetch(u); if(!r.ok) throw new Error('이미지를 가져오지 못했어요'); bmp[u]=await createImageBitmap(await r.blob()); }));
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    pages.forEach((cmds,pi)=>{ const cv=document.createElement('canvas'); cv.width=W; cv.height=H; drawNotePage(cv.getContext('2d'),K,cmds,pi,n.name,bmp); if(pi>0) doc.addPage(); doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297); });
    doc.save(`오답노트_${n.name}.pdf`); toast('PDF를 저장했어요. 저장된 파일을 열어서 인쇄해 주세요.');
  }catch(e){ toast('PDF를 만들지 못했어요: '+(e.message||e)+' (바로 인쇄를 눌러 보세요)'); }
  if(btn) btn.disabled=false;
}

async function uploadBook(){
  const say=m=>{Te.msg=m;const r=$('#bres');if(r)r.textContent=m;};
  const name=$('#bn').value.trim(), fx=$('#bx').files[0], fz=$('#bz').files[0];

  if(!fx||!fz){say('정답표 엑셀과 문항 이미지 zip을 둘 다 올려 주세요. 이미지가 없으면 오답 노트를 만들 수 없어요.');return;}
  $('#bgo').disabled=true;
  try{
    say('엑셀을 읽는 중이에요...');
    const wb=XLSX.read(await fx.arrayBuffer(),{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    const hi=rows.findIndex(r=>r.some(c=>String(c).trim()==='번호')&&r.some(c=>String(c).trim()==='정답'));
    if(hi<0){say('엑셀 첫 줄에 번호, 정답 열 이름이 있어야 해요.');$('#bgo').disabled=false;return;}
    const h=rows[hi].map(c=>String(c).trim()), ci=k=>h.indexOf(k), items={};
    rows.slice(hi+1).forEach(r=>{const n=parseInt(r[ci('번호')]); if(!n)return; const ans=String(r[ci('정답')]??'').trim();
      let type=ci('유형')>=0?String(r[ci('유형')]||'').trim():''; if(!type) type=/^[①②③④⑤]$/.test(ans)?'객관식':'단답';
      items[n]={num:n,tag:ci('출처코드')>=0?String(r[ci('출처코드')]||'').replace(/^-/,''):'',type,answer:ans,parts:type==='복수답'?parseParts(ans):null};});
    const nums=Object.keys(items).map(Number); if(!nums.length){say('문항을 한 개도 못 읽었어요.');$('#bgo').disabled=false;return;}
    say('이미지 묶음을 읽는 중이에요...');
    const z=await JSZip.loadAsync(await fz.arrayBuffer()); const prob={}, sol={};
    Object.values(z.files).forEach(f=>{ if(f.dir)return; const base=f.name.split('/').pop(); const m=base.match(/^(\d+)(_해설)?\.(png|jpe?g|webp)$/i); if(!m)return; (m[2]?sol:prob)[+m[1]]=f; });
    const miss=nums.filter(n=>!prob[n]), extra=Object.keys(prob).map(Number).filter(n=>!items[n]);
    if(miss.length||extra.length){say(`번호가 서로 맞지 않아 올리지 않았어요. 이미지가 없는 번호: ${miss.slice(0,15).join(', ')||'없음'} / 정답표에 없는 이미지 번호: ${extra.slice(0,15).join(', ')||'없음'}`);$('#bgo').disabled=false;return;}
    const book=(await must(sb.from('books').insert({name}).select().single()));
    const total=nums.length; let done=0;
    await must(sb.from('items').insert(nums.map(n=>({book_id:book.id,num:n,tag:items[n].tag,type:items[n].type,answer:items[n].answer,parts:items[n].parts||null}))));
    const jobs=[]; nums.forEach(n=>{jobs.push(['p',n]); if(sol[n]) jobs.push(['s',n]);});
    let idx=0;
    const worker=async()=>{ while(idx<jobs.length){ const [k,n]=jobs[idx++]; const f=(k==='p'?prob:sol)[n]; const blob=await f.async('blob');
      const path=`${book.id}/${n}${k==='s'?'_a':''}.png`;
      const r=await sb.storage.from('problems').upload(path,blob,{contentType:'image/png',upsert:true}); if(r.error) throw r.error;
      done++; if(done%10===0||done===jobs.length) say(`이미지를 올리는 중이에요... ${done} / ${jobs.length}`); } };
    await Promise.all([worker(),worker(),worker(),worker()]);
    say(`${name}: ${total}문항을 올렸어요.`); toast('교재를 올렸어요.'); await teacherLoad(); render();
  }catch(e){ say('올리는 중 문제가 생겼어요: '+errMsg(e)); const b=$('#bgo'); if(b)b.disabled=false; }
}

/* 완수율과 정답률 계산 도우미 */
function seoulDate(ts){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date(ts)); }
function weekKey(ts){ const d=new Date(seoulDate(new Date(ts).getTime()-1000)+'T00:00:00Z'); const dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow); return d.toISOString().slice(0,10); }
function periodStart(per){
  const now=new Date(); const today=seoulDate(now);
  if(per==='week') return new Date(weekKey(now.getTime()+1000)+'T00:00:00+09:00').getTime();
  if(per==='month') return new Date(today.slice(0,8)+'01T00:00:00+09:00').getTime();
  if(per==='q') return now.getTime()-90*864e5;
  return 0;
}
/* 한 학생의 기간 내 기록: 마감이 지났거나 제출한 숙제만 센다 */
function studentStat(list, per){
  const from=periodStart(per), now=Date.now(); let n=0,dn=0,ok=0,tot=0;
  list.forEach(x=>{ const due=new Date(x.due).getTime(); if(due<from) return; if(!(x.done||due<=now)) return; n++; if(x.done){dn++; ok+=x.ok; tot+=x.tot;} });
  return {n,dn,ok,tot};
}
function weeklyCols(items, weeks){
  // items: [{due,done}] -> 최근 weeks주의 완수율 (마감이 지났거나 제출한 숙제 기준)
  const now=Date.now(); const cur=weekKey(now+1000); const keys=[];
  let d=new Date(cur+'T00:00:00Z'); for(let i=0;i<weeks;i++){ keys.unshift(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()-7); }
  const m={}; keys.forEach(k=>m[k]={n:0,dn:0});
  items.forEach(x=>{ const due=new Date(x.due).getTime(); if(!(x.done||due<=now)) return; const k=weekKey(due); if(m[k]){m[k].n++; if(x.done)m[k].dn++;} });
  return keys.map(k=>({k, label:`${+k.slice(5,7)}/${+k.slice(8,10)}`, pct:m[k].n?Math.round(m[k].dn*100/m[k].n):null, n:m[k].n, dn:m[k].dn, cur:k===cur}));
}

}

    <div class="meta">${perLabels[H.per]}, ${H.cls==='all'?'전체 반':esc(cName(H.cls))}: 완수율 ${tot.n?Math.round(tot.dn*100/tot.n):0}% (${tot.dn}/${tot.n}), 정답률 ${tot.t?Math.round(tot.ok*100/tot.t):0}%</div></div>
   <div class="panel"><h2>학생별 완수율<small>${perLabels[H.per]}</small></h2><div class="hg"><span><b style="background:var(--accent)"></b>완수율</span><span><b style="background:var(--orange)"></b>정답률</span></div>${bars||'<div class="meta">학생이 없어요.</div>'}</div>
   <div class="panel"><h2>주별 완수율<small>최근 8주, 주황은 이번 주</small></h2>${colsHTML(wk)}<div class="meta">마감이 지났거나 제출한 숙제를 기준으로 계산해요.</div>

    <h2 style="margin-top:8px">이번 달 미루기를 쓴 학생</h2><div>${used.length?used.map(esc).join(', '):'<span class="meta">없어요.</span>'}</div></div></div>`;
}

/* ================= 이벤트 ================= */

  $$('[data-lt]').forEach(b=>b.onclick=()=>{A.login=b.dataset.lt;render();});

    const p=i.selectionStart??i.value.length; i.value=i.value.slice(0,p)+b.dataset.key+i.value.slice(p); i.focus(); i.setSelectionRange(p+1,p+1); syncInput(i);};});

  $$('[data-tab]').forEach(b=>b.onclick=async()=>{ if(b.dataset.tab==='ref'){ await refreshTeacher(true); return; } if(b.dataset.tab==='out'){await sb.auth.signOut();mode=null;Te.d=null;Te.me=null;render();return;} Te.tab=b.dataset.tab;Te.note=null;render();});
  const cg=$('#cgo'); if(cg) cg.onclick=async()=>{const e=$('#lerr');e.textContent='';try{await must(sb.rpc('claim_staff',{p_code:$('#cc').value}));await teacherLoad();render();}catch(x){e.textContent=errMsg(x);}};
  const co=$('#cout'); if(co) co.onclick=async()=>{await sb.auth.signOut();mode=null;Te.me=null;Te.d=null;render();};
  const sf=$('#sfadd'); if(sf) sf.onclick=async()=>{const n=$('#sfn').value.trim(); if(!n){toast('이름을 적어 주세요.');return;}
    const ids=$$('[name=nsc]:checked').map(i=>i.value);
    try{const code=await must(sb.rpc('admin_add_staff',{p_name:n,p_role:$('#sfr').value,p_class_ids:ids}));Te.sfmsg=`${n}님 초대 코드: ${code}  (이 코드를 ${n}님에게 알려 주세요)`;await teacherLoad();render();}catch(e){toast(errMsg(e));}};
  $$('[data-sfsave]').forEach(b=>b.onclick=async()=>{const id=b.dataset.sfsave;const ids=$$(`[name=sfc${id}]:checked`).map(i=>i.value);
    try{await must(sb.rpc('admin_set_staff_classes',{p_staff:id,p_class_ids:ids}));await teacherLoad();render();toast('담당 반을 저장했어요.');}catch(e){toast(errMsg(e));}});
  $$('[data-sfcode]').forEach(b=>b.onclick=async()=>{try{const c=await must(sb.rpc('admin_new_code',{p_staff:b.dataset.sfcode}));Te.sfmsg='새 초대 코드: '+c+'  (이 코드로 다시 가입하면 연결돼요)';await teacherLoad();render();}catch(e){toast(errMsg(e));}});
  $$('[data-sfdel]').forEach(b=>b.onclick=async()=>{ if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='정말 지우기';return;}
    try{await must(sb.rpc('admin_delete_staff',{p_staff:b.dataset.sfdel}));await teacherLoad();render();toast('지웠어요. 이 사람은 더 이상 로그인해도 쓸 수 없어요.');}catch(e){toast(errMsg(e));}});
  $$('[data-per]').forEach(b=>b.onclick=()=>{ (Te.hs||(Te.hs={per:'month',cls:'all'})).per=b.dataset.per; render(); });
  const hc=$('#hcls'); if(hc) hc.onchange=()=>{ (Te.hs||(Te.hs={per:'month',cls:'all'})).cls=hc.value; render(); };
  const vPdf=$('#npdf'); if(vPdf) vPdf.onclick=makeNotePdf;
  $$('[data-svopen]').forEach(b=>b.onclick=()=>{ const V=svInit(); V.sid=b.dataset.svopen; svDefaultSel(V.sid); Te.tab='sv'; render(); });
  const vQ=$('#svq'); if(vQ){
    const bindList=()=>$$('[data-svs]').forEach(b=>b.onclick=()=>{ const V=svInit(); V.sid=b.dataset.svs; svDefaultSel(V.sid); render(); });
    bindList();
    vQ.oninput=()=>{ svInit().q=vQ.value; const l=$('#svlist'); if(l){ l.innerHTML=svListHTML(); bindList(); } };
    const vC=$('#svc'); vC.onchange=()=>{ svInit().cls=vC.value; const l=$('#svlist'); if(l){ l.innerHTML=svListHTML(); bindList(); } };
  }
  $$('[data-svsel]').forEach(c=>c.onchange=()=>{ const V=svInit(); if(c.checked) V.sel[c.dataset.svsel]=true; else delete V.sel[c.dataset.svsel]; render(); });
  $$('[data-svx]').forEach(b=>b.onclick=()=>{ const V=svInit(); const k=b.dataset.svx; if(V.excl[k]) delete V.excl[k]; else V.excl[k]=true; render(); });
  const vAll=$('#svall'); if(vAll) vAll.onclick=()=>{ const V=svInit(); svDefaultSel(V.sid); render(); };
  const vNone=$('#svnone'); if(vNone) vNone.onclick=()=>{ const V=svInit(); V.sel={}; render(); };
  const vNote=$('#svnote'); if(vNote) vNote.onclick=svBuildNote;
  const nc=$('#nclose'); if(nc) nc.onclick=()=>{Te.note=null;render();};
  const mk=$('#mk'); if(mk) mk.onclick=newHw;
  $$('[data-open]').forEach(r=>r.onclick=()=>{Te.aid=r.dataset.open;Te.sid=null;Te.grade=null;render();});
  $$('[data-stu]').forEach(r=>r.onclick=async()=>{Te.sid=r.dataset.stu;Te.grade=null;render();
    const a=Te.d.assignments.find(x=>x.id===Te.aid), s=tSub(a,Te.sid); if(s&&s.done&&a.book_id){try{await loadGrade(a,Te.sid);render();}catch(e){toast(errMsg(e));}}});
  $$('[data-set]').forEach(b=>b.onclick=()=>{const [n,v]=b.dataset.set.split('|');toggleGrade(n,v);});
  const nb=$('[data-note]'); if(nb) nb.onclick=()=>buildNote(Te.d.assignments.find(x=>x.id===Te.aid),Te.sid);
  const os=$('#osave'); if(os) os.onclick=saveOverride;
  const orr=$('#oreset'); if(orr) orr.onclick=async()=>{try{await must(sb.from('overrides').delete().eq('assignment_id',Te.aid).eq('student_id',Te.sid));await teacherLoad();render();toast('반 숙제와 같게 되돌렸어요.');}catch(e){toast(errMsg(e));}};
  $$('[data-delhw]').forEach(b=>b.onclick=async()=>{ if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='한 번 더 누르면 숙제와 제출 기록이 지워져요';return;}
    try{await must(sb.from('assignments').delete().eq('id',b.dataset.delhw));Te.aid=null;Te.sid=null;await teacherLoad();render();toast('숙제를 지웠어요.');}catch(e){toast(errMsg(e));}});
  const ca=$('#cadd'); if(ca) ca.onclick=async()=>{const n=$('#cn').value.trim();if(!n)return;try{await must(sb.from('classes').insert({name:n}));await teacherLoad();render();}catch(e){toast(errMsg(e));}};
  $$('[data-cdel]').forEach(b=>b.onclick=async()=>{ if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='정말 지우기';return;} try{await must(sb.from('classes').delete().eq('id',b.dataset.cdel));await teacherLoad();render();}catch(e){toast(errMsg(e));}});
  const sa=$('#sadd'); if(sa) sa.onclick=addStudents;
  $$('[data-pin]').forEach(b=>b.onclick=async()=>{const p=prompt('새 번호를 숫자 4~6자리로 적어 주세요');if(!p)return;try{await must(sb.rpc('teacher_set_pin',{p_student:b.dataset.pin,p_pin:p}));toast('번호를 바꿨어요.');}catch(e){toast(errMsg(e));}});
  $$('[data-sdel]').forEach(b=>b.onclick=async()=>{ if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='정말 지우기';return;}
    try{await must(sb.from('students').delete().eq('id',b.dataset.sdel));await teacherLoad();render();}catch(e){toast(errMsg(e));}});
  const bg=$('#bgo'); if(bg&&mode==='teacher') bg.onclick=uploadBook;
  $$('[data-bkdel]').forEach(b=>b.onclick=()=>{Te.delbook=b.dataset.bkdel;render();});
  $$('[data-bkno]').forEach(b=>b.onclick=()=>{Te.delbook=null;render();});
  $$('[data-bkok]').forEach(b=>b.onclick=()=>removeBook(b.dataset.bkok));
}
async function doLogin(){
  const err=$('#lerr'); err.textContent='';
  try{
    if(A.login==='student'){
      const r=await must(sb.rpc('student_login',{p_name:$('#ln').value,p_pin:$('#lp').value}));
      St.token=r.token; St.name=r.name; St.cls=r.class_name; localStorage.setItem('odm_token',r.token); localStorage.setItem('odm_name',r.name); localStorage.setItem('odm_cls',r.class_name);
      mode='student'; St.screen='home'; await studentHome(); render();
    } else if(A.tmode==='up'){
      const r=await sb.auth.signUp({email:$('#le').value.trim(),password:$('#lw').value});
      if(r.error){err.textContent=/registered|exists/i.test(r.error.message)?'이미 가입한 이메일이에요. "이미 가입했어요"로 로그인해 주세요.':'가입하지 못했어요: '+r.error.message;return;}
      if(!r.data.session){err.textContent='확인 메일을 보냈어요. 메일의 링크를 누른 뒤 "이미 가입했어요"로 로그인하고 초대 코드를 넣어 주세요.';return;}
      await must(sb.rpc('claim_staff',{p_code:$('#lc').value}));
      mode='teacher'; await teacherLoad(); render();
    } else {
      const r=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lw').value});
      if(r.error){err.textContent='이메일이나 비밀번호가 맞지 않아요.';return;}
      mode='teacher'; await teacherLoad(); render();
    }
  }catch(e){ err.textContent=errMsg(e); }
}
async function newHw(){
  const d=Te.d; const bookId=$('#nb').value; const book=d.books.find(b=>b.id===bookId);
  const f=+$('#nf').value, t=+$('#nt').value, max=book?book.max:0;
  if(!book||!f||!t||f>t||t>max){toast(`번호를 확인해 주세요. 이 교재는 1~${max}번이에요.`);return;}
  const cls=$$('[name=nc]:checked').map(i=>i.value), sel=[...$('#ns').selectedOptions].map(o=>o.value);
  if(!cls.length&&!sel.length){toast('반이나 학생을 하나 이상 골라 주세요.');return;}
  const date=$('#nd').value; if(!date){toast('제출 마감 날짜를 골라 주세요.');return;}
  try{
    const a=await must(sb.from('assignments').insert({book_id:book.id,book_name:book.name,from_num:f,to_num:t,due:midnightOf(date),title:`${book.name} ${f}~${t}번`}).select().single());
    const rows=cls.map(c=>({assignment_id:a.id,class_id:c})).concat(sel.map(s=>({assignment_id:a.id,student_id:s})));
    await must(sb.from('assignment_targets').insert(rows));
    await teacherLoad(); Te.aid=a.id; Te.sid=null; render(); toast('숙제를 냈어요. 학생 폰에서 바로 보여요.');
  }catch(e){ toast(errMsg(e)); }
}
async function toggleGrade(n,want){
  const a=Te.d.assignments.find(x=>x.id===Te.aid), sid=Te.sid, g=Te.grade; if(!g) return;
  const prev=g.r[n], pov=g.ov[n]; if(prev===want) return; g.r[n]=want; g.ov[n]=want; const c=countR(g.r);
  try{
    await must(sb.from('submissions').update({result:{r:g.r,ok:c.ok,tot:c.tot,chk:c.chk},ov:g.ov}).eq('assignment_id',a.id).eq('student_id',sid));
    const s=tSub(a,sid); if(s) s.result={r:{...g.r},ok:c.ok,tot:c.tot,chk:c.chk}; render();
  }catch(e){ g.r[n]=prev; g.ov[n]=pov; toast(errMsg(e)); }
}
async function saveOverride(){
  const a=Te.d.assignments.find(x=>x.id===Te.aid), sid=Te.sid;
  const f=+$('#ofrom').value,t=+$('#oto').value; const book=Te.d.books.find(b=>b.id===a.book_id); const max=book?book.max:9999;
  if(!f||!t||f>t||t>max){toast('번호를 확인해 주세요.');return;}
  const dv=$('#odue').value;
  try{ await must(sb.from('overrides').upsert({assignment_id:a.id,student_id:sid,from_num:f,to_num:t,due:dv?midnightOf(dv):a.due})); await teacherLoad(); render(); toast(sName(sid)+' 학생만 바뀌었어요.'); }
  catch(e){ toast(errMsg(e)); }
}
async function addStudents(){
  const cls=$('#sc').value; const lines=$('#sl').value.split('\n').map(l=>l.trim()).filter(Boolean); const out=[]; let ok=0;
  if(!cls){toast('먼저 반을 만들어 주세요.');return;}
  for(const l of lines){ const m=l.match(/^(.+?)[\s,]+(\d{4,6})$/); if(!m){out.push(`"${l}" 형식이 맞지 않아요.`);continue;}
    try{ await must(sb.rpc('teacher_add_student',{p_name:m[1],p_class:cls,p_pin:m[2]})); ok++; }catch(e){ out.push(`${m[1]}: ${String(e.message).includes('duplicate')?'같은 이름이 이미 있어요.':errMsg(e)}`); } }
  await teacherLoad(); Te.tab='st'; render(); const r=$('#smsg'); if(r) r.textContent=`${ok}명을 추가했어요. ${out.join(' ')}`; toast(`${ok}명을 추가했어요.`);
}
async function refreshTeacher(manual){
  if(mode!=='teacher'||!Te.me||Te.busy) return;
  const el=document.activeElement;
  if(!manual && el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  if(Te.note) return;
  const keepSid=Te.sid, keepAid=Te.aid;
  await teacherLoad();
  if(keepAid && keepSid){ const a=Te.d.assignments.find(x=>x.id===keepAid); const sub=a&&tSub(a,keepSid); if(a&&sub&&sub.done&&a.book_id){ try{await loadGrade(a,keepSid);}catch(e){} } }
  render(); if(manual) toast('최신 내용으로 새로 불러왔어요.');
}
window.addEventListener('focus',()=>refreshTeacher(false));
setInterval(()=>{ if(document.visibilityState==='visible') refreshTeacher(false); },60000);
boot();
</script>
