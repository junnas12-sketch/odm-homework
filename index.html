<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘도수학 숙제</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f2f7; --card:#ffffff; --fg:#23212e; --muted:#6c6879; --line:#e1dfea;
  --accent:#6b5ba8; --accent-soft:#ebe7f6; --accent-fg:#ffffff;
  --ok:#2f7d57; --ok-soft:#e1f2e9; --bad:#b4453b; --bad-soft:#f8e4e1; --warn:#9a6a14; --warn-soft:#f8efd9;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#17161d; --card:#211f2a; --fg:#ece9f5; --muted:#a29eb4; --line:#34313f;
  --accent:#a99be0; --accent-soft:#2e2a45; --accent-fg:#17161d;
  --ok:#6cc79b; --ok-soft:#1d3329; --bad:#ee8c82; --bad-soft:#3a2321; --warn:#e3b45c; --warn-soft:#38301c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;padding:0 max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:14px 0 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:700;font-size:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.phone{max-width:430px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.phone-h{padding:14px 16px;background:var(--accent);color:var(--accent-fg);display:flex;justify-content:space-between;align-items:center;gap:8px}
.phone-h b{font-size:16px}
.pb{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.who{font-size:13px;color:var(--muted)}
.hw{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.hw h3{margin:0;font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:0}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{border:0;background:var(--accent);color:var(--accent-fg);padding:12px 16px;border-radius:12px;font-weight:700;width:100%}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:none;border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.q{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.q:first-of-type{border-top:0;padding-top:0}
.qh{display:flex;align-items:center;gap:8px}
.qn{font-weight:700;font-size:18px;min-width:30px}
.qt{font-size:12px;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.choices button{padding:10px 0;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:17px}
.choices button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;flex-wrap:wrap;gap:5px}
.keys button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 9px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
.chk input{width:18px;height:18px}
.pager{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.res{text-align:center;padding:8px 0}
.res .big{font-size:44px;font-weight:700;color:var(--accent)}
.msg{background:var(--accent-soft);color:var(--accent);padding:12px 14px;border-radius:12px;font-size:14px}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.rl span{text-align:center;padding:7px 0;border-radius:9px;font-weight:700;font-size:14px}
.rl .o{background:var(--ok-soft);color:var(--ok)}.rl .x{background:var(--bad-soft);color:var(--bad)}.rl .c{background:var(--warn-soft);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:16px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:110px}
.classes{display:flex;flex-wrap:wrap;gap:8px}
.classes label{display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.classes input{width:auto}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent-soft)}
.box{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw}
.det div.r{display:grid;grid-template-columns:40px 1fr 110px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.center{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.center h1{margin:0;font-size:22px}
/* 오답 노트 인쇄 */
#note{display:none}
.note-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.note-page{background:#fff;color:#000;padding:0}
.note-h{font-weight:700;font-size:15px;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px}
.note-cols{column-count:2;column-gap:10mm}
.note-q{break-inside:avoid;margin-bottom:6mm}
.note-q b{font-size:14px;display:block;margin-bottom:2mm}
.note-q img{max-width:100%;display:block}
.note-q .tg{font-size:9px;color:#666;text-align:right}
.note-sec{break-before:page;margin-top:0}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0}
  .wrap>.top,.note-bar,.toast{display:none!important}
  .wrap{padding:0;max-width:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200);}
function fmt(ts){
  const parts=d=>{const p=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);const o={};p.forEach(x=>o[x.type]=x.value);return o;};
  const d=new Date(ts), p=parts(d);
  if((p.hour==='24'||p.hour==='00')&&p.minute==='00'){const q=parts(new Date(d.getTime()-1000));return `${q.month}월 ${q.day}일 밤 12시`;}
  return `${p.month}월 ${p.day}일 ${p.hour}:${p.minute}`;
}
function seoulToday(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());return p;}  // YYYY-MM-DD
function midnightOf(dateStr){return new Date(new Date(dateStr+'T00:00:00+09:00').getTime()+864e5).toISOString();}
const ERR = {bad_login:'이름이나 번호가 맞지 않아요.', locked:'여러 번 틀려서 잠시 잠겼어요. 15분 뒤에 다시 해 주세요.', no_session:'다시 로그인해 주세요.',
  already_done:'이미 제출한 숙제예요.', not_found:'이 숙제를 찾을 수 없어요.', gone:'지난 교재라 더 풀 수 없어요.', not_late:'아직 마감 전이에요.', ext_used:'이번 달 미루기는 이미 썼어요.',
  bad_pin:'번호는 숫자 4~6자리로 적어 주세요.', not_teacher:'선생님 로그인이 필요해요.', bad_code:'초대 코드가 맞지 않거나 이미 쓴 코드예요.', not_your_class:'맡은 반이 아니에요.', not_admin:'관리자만 할 수 있어요.', self_delete:'자기 자신은 지울 수 없어요.'};
function errMsg(e){const m=(e&&e.message)||String(e); if(/foreign key|violates/i.test(m)) return '학생이 있는 반은 지울 수 없어요. 학생을 먼저 다른 반으로 옮기거나 지워 주세요.'; for(const k in ERR) if(m.includes(k)) return ERR[k]; return '문제가 생겼어요: '+m;}
async function must(p){const r=await p; if(r.error) throw r.error; return r.data;}

if(!window.ODM || /여기에/.test(ODM.url)){
  document.getElementById('app').innerHTML='<div class="center"><h1>설정이 필요해요</h1><div class="box">web/config.js 파일에 Supabase 프로젝트 주소와 공개 키를 넣어 주세요. 설치방법.md의 3번을 따라 하면 돼요.</div></div>';
  throw new Error('config');
}
const sb = supabase.createClient(ODM.url, ODM.key);

const GRADED = t => t==='객관식' || t==='단답';
let mode = null;               // 'student' | 'teacher' | null
const A = {login:'student', tmode:'in'};   // 로그인 화면 탭
// 학생 상태
const St = {token:localStorage.getItem('odm_token')||'', name:localStorage.getItem('odm_name')||'', cls:localStorage.getItem('odm_cls')||'', screen:'home', home:null, aid:null, w:null, page:0, result:null, saveT:null};
// 선생님 상태
const Te = {tab:'hw', d:null, me:null, aid:null, sid:null, grade:null, note:null, busy:false, msg:'', sfmsg:''};
const isAdmin = () => Te.me && Te.me.role==='admin';

/* ================= 시작 ================= */
async function boot(){
  const {data} = await sb.auth.getSession();
  if(data.session){ mode='teacher'; await teacherLoad(); }
  else if(St.token){ mode='student'; await studentHome(); }
  else mode=null;
  render();
}
function render(){
  const app=$('#app');
  if(!mode) app.innerHTML=loginHTML();
  else if(mode==='student') app.innerHTML=studentHTML();
  else if(!Te.me) app.innerHTML=claimHTML();
  else app.innerHTML=teacherHTML();
  bind();
}
function loginHTML(){
  return `<div class="center"><h1>오늘도수학 숙제</h1>
   <div class="tabs"><button data-lt="student" aria-pressed="${A.login==='student'}">학생</button><button data-lt="teacher" aria-pressed="${A.login==='teacher'}">선생님</button></div>
   ${A.login==='student'?`
    <div class="fld">이름<input id="ln" type="text" autocomplete="username" placeholder="선생님이 알려준 이름"></div>
    <div class="fld">번호 (숫자 4자리 이상)<input id="lp" type="password" inputmode="numeric" autocomplete="current-password"></div>
    <button class="btn" id="lgo">들어가기</button>`:`
    <div class="fld">이메일<input id="le" type="email" autocomplete="username"></div>
    <div class="fld">비밀번호${A.tmode==='up'?' (6자 이상, 새로 정하세요)':''}<input id="lw" type="password" autocomplete="${A.tmode==='up'?'new-password':'current-password'}"></div>
    ${A.tmode==='up'?'<div class="fld">초대 코드 (관리자에게 받은 코드)<input id="lc" type="text" autocomplete="off" autocapitalize="characters"></div>':''}
    <button class="btn" id="lgo">${A.tmode==='up'?'처음이에요, 가입하기':'선생님 로그인'}</button>
    <button class="btn sm line" data-tm="${A.tmode==='up'?'in':'up'}" style="align-self:center">${A.tmode==='up'?'이미 가입했어요':'처음이에요 (초대 코드로 가입)'}</button>`}
   <div class="meta" id="lerr" style="color:var(--bad)"></div></div>`;
}

function claimHTML(){
  return `<div class="center"><h1>초대 코드를 넣어 주세요</h1>
   <div class="meta">관리자에게 받은 초대 코드를 넣으면 선생님 계정으로 연결돼요.</div>
   <div class="fld">초대 코드<input id="cc" type="text" autocomplete="off" autocapitalize="characters"></div>
   <button class="btn" id="cgo">연결하기</button>
   <button class="btn sm line" id="cout" style="align-self:center">로그아웃</button>
   <div class="meta" id="lerr" style="color:var(--bad)"></div></div>`;
}
/* ================= 학생 ================= */
async function studentHome(){
  try{ St.home = await must(sb.rpc('student_home',{p_token:St.token})); }
  catch(e){ if(String(e.message).includes('no_session')) return studentLogout(); toast(errMsg(e)); }
}
function studentLogout(){ St.token=''; localStorage.removeItem('odm_token'); mode=null; render(); }
function nowMs(){return Date.now();}
function studentHTML(){
  const head=`<div class="phone-h"><b>${St.screen==='home'?'숙제':'숙제 풀기'}</b><span style="font-size:13px">${esc(St.name)}</span></div>`;
  let body='';
  if(St.screen==='home') body=sHome();
  else if(St.screen==='work') body=sWork();
  else body=sResult();
  return `<div class="phone">${head}<div class="pb">${body}</div></div>`;
}
function sHome(){
  const h=St.home; if(!h) return '<div class="meta">불러오는 중이에요...</div>';
  const cards=h.assignments.map(a=>{
    const late = new Date(a.due).getTime() < nowMs();
    let pill,act='';
    if(a.done){
      pill='<span class="pill ok">제출 완료</span>';
      act=`<div class="meta">맞힌 개수 ${a.result.ok} / ${a.result.tot}${a.result.chk?`, 선생님 확인 ${a.result.chk}문항`:''}</div><button class="btn sec" data-act="result" data-aid="${a.id}">결과 보기</button>`;
    } else if(!a.has_book){ pill='<span class="pill bad">교재 정리됨</span>'; act='<div class="meta">지난 학기 교재라 더 풀 수 없어요.</div>'; }
    else if(!late){ pill='<span class="pill warn">해야 해요</span>'; act=`<button class="btn" data-act="work" data-aid="${a.id}">풀러 가기</button>`; }
    else {
      pill='<span class="pill bad">기한 지남</span>';
      act=`<button class="btn line" data-act="work" data-aid="${a.id}">늦게라도 제출하기</button>
        <button class="btn sec" data-act="ext" data-aid="${a.id}" ${h.ext_used?'disabled':''}>${h.ext_used?'이번 달 미루기는 이미 썼어요':'내일 밤 12시까지 미루기 (이번 달 1번)'}</button>`;
    }
    return `<div class="hw"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>${esc(a.title)}</h3>${pill}</div>
      <div class="meta">마감 ${fmt(a.due)}${a.extended?' (미룸)':''}</div>${act}</div>`;
  }).join('');
  return `<div class="who">${esc(St.cls)} ${esc(St.name)} 학생</div>${cards||'<div class="meta">받은 숙제가 없어요.</div>'}<button class="btn sm line" id="lout" style="align-self:center">로그아웃</button>`;
}
async function openWork(aid){
  try{
    const w = await must(sb.rpc('student_items',{p_token:St.token,p_aid:aid}));
    St.w={...w,aid}; St.aid=aid; St.page=0; St.screen='work'; render();
  }catch(e){ toast(errMsg(e)); }
}
function sWork(){
  const w=St.w; const per=8, items=w.items, pages=Math.max(1,Math.ceil(items.length/per)); const p=Math.min(St.page,pages-1);
  const cur=items.slice(p*per,p*per+per);
  const qs=cur.map(q=>{
    let inp='';
    if(q.type==='객관식') inp=`<div class="choices">${[1,2,3,4,5].map(i=>`<button data-ch="${q.num}" data-v="${i}" aria-pressed="${w.answers[q.num]==i}">${'①②③④⑤'[i-1]}</button>`).join('')}</div>`;
    else if(q.type==='단답') inp=`<input type="text" data-in="${q.num}" value="${esc(w.answers[q.num]||'')}" placeholder="답을 적어요" autocomplete="off" autocapitalize="off">`;
    else inp=`<label class="chk"><input type="checkbox" data-ck="${q.num}" ${w.checked[q.num]?'checked':''}>풀었어요. 선생님이 확인해 줄게요</label>`;
    return `<div class="q"><div class="qh"><span class="qn">${q.num}</span><span class="qt">${q.type==='객관식'?'번호 고르기':q.type==='단답'?'답 쓰기':'선생님 확인'}</span></div>${inp}</div>`;
  }).join('');
  const keys=['−','/','√','π','^','≤','≥','(',')'].map(k=>`<button data-key="${k}" type="button">${k}</button>`).join('');
  return `<div class="meta">${esc(w.title)}</div>
   <div class="pager"><span>${p+1} / ${pages} 쪽, 한 쪽에 ${per}문항</span></div>
   ${qs}<div class="keys">${keys}</div>
   <div style="display:flex;gap:8px;margin-top:auto"><button class="btn line" data-act="prev" ${p===0?'disabled':''}>이전 쪽</button>
   ${p<pages-1?`<button class="btn" data-act="next">다음 쪽</button>`:`<button class="btn" data-act="submit">제출하기</button>`}</div>
   <button class="btn sm line" data-act="home" style="align-self:center">숙제 목록으로</button>`;
}
function sResult(){
  const r=St.result, wrong=Object.values(r.r).filter(v=>v==='x').length;
  const msg=wrong===0?'전부 맞혔어요! 오늘도 해냈네요.':`제출 완료! ${wrong}문항은 선생님과 같이 다시 볼게요. 끝까지 한 게 대단해요.`;
  return `<div class="res"><div class="big">${r.ok} / ${r.tot}</div><div class="meta">맞힌 개수${r.chk?`, 선생님 확인 ${r.chk}문항`:''}</div></div>
   <div class="msg">${msg}</div>
   <div class="rl">${Object.entries(r.r).sort((a,b)=>a[0]-b[0]).map(([n,v])=>`<span class="${v}">${n}${v==='o'?' 맞음':v==='x'?' 틀림':' 확인'}</span>`).join('')}</div>
   <div class="meta">정답은 보여주지 않아요. 틀린 문제는 선생님이 오답 노트로 다시 줘요.</div>

async function sAct(a,aid){
  if(a==='work') return openWork(aid);
  if(a==='result'){ const x=St.home.assignments.find(y=>y.id===aid); St.result=x.result; St.screen='result'; return render(); }
  if(a==='home'){ St.screen='home'; await studentHome(); return render(); }
  if(a==='next'){ St.page++; return render(); }
  if(a==='prev'){ St.page=Math.max(0,St.page-1); return render(); }
  if(a==='ext'){
    try{ await must(sb.rpc('student_extend',{p_token:St.token,p_aid:aid})); toast('내일 밤 12시까지로 미뤘어요. 이번 달 미루기는 이걸로 끝이에요.'); await studentHome(); render(); }
    catch(e){ toast(errMsg(e)); }
    return;
  }

    clearTimeout(St.saveT);
    const b=$('[data-act=submit]'); if(b) b.disabled=true;
    try{ St.result=await must(sb.rpc('student_submit',{p_token:St.token,p_aid:St.aid,p_answers:St.w.answers,p_checked:St.w.checked})); St.screen='result'; await studentHome(); render(); }

async function teacherLoad(){
  try{
    Te.me = await must(sb.rpc('my_profile'));
    if(!Te.me){ Te.d=null; return; }
    const [classes,students,books,assignments,targets,overrides,subs,exts]=await Promise.all([
      must(sb.from('classes').select('*').order('name')),
      must(sb.from('students').select('id,name,class_id,active').order('name')),
      must(sb.from('books').select('*').order('created_at')),
      must(sb.from('assignments').select('*').order('due',{ascending:false})),
      must(sb.from('assignment_targets').select('*')),
      must(sb.from('overrides').select('*')),
      must(sb.from('submissions').select('assignment_id,student_id,done,result,submitted_at')),
      must(sb.from('extensions').select('*'))]);
    Te.d={classes,students,books,assignments,targets,overrides,subs,exts,staff:[],sclass:[]};
    if(isAdmin()){ Te.d.staff=await must(sb.from('staff').select('*').order('created_at')); Te.d.sclass=await must(sb.from('staff_classes').select('*')); }
    // 교재별 문항 수
    for(const b of books){ const r=await sb.from('items').select('num',{count:'exact',head:true}).eq('book_id',b.id); b.count=r.count||0; }
  }catch(e){ toast(errMsg(e)); }
}
function tTargets(a){
  const d=Te.d, set=new Set();
  d.targets.filter(t=>t.assignment_id===a.id).forEach(t=>{
    if(t.student_id) set.add(t.student_id);
    if(t.class_id) d.students.filter(s=>s.class_id===t.class_id&&s.active).forEach(s=>set.add(s.id));
  });
  return [...set];
}
const sName=id=>{const s=Te.d.students.find(x=>x.id===id);return s?s.name:'(삭제됨)';};
const cName=id=>{const c=Te.d.classes.find(x=>x.id===id);return c?c.name:'';};
function tEff(a,sid){const o=Te.d.overrides.find(x=>x.assignment_id===a.id&&x.student_id===sid);const e=Te.d.exts.find(x=>x.assignment_id===a.id&&x.student_id===sid);
  return {from:o?o.from_num:a.from_num,to:o?o.to_num:a.to_num,due:e?e.new_due:(o?o.due:a.due),over:!!o,ext:!!e};}
function tSub(a,sid){return Te.d.subs.find(x=>x.assignment_id===a.id&&x.student_id===sid);}
function teacherHTML(){
  const tab=Te.tab;
  const tabs=[['hw','숙제'],['st','반과 학생'],['bk','교재'],['hs','이력']].concat(isAdmin()?[['sf','선생님']]:[]);
  const nav=`<div class="top"><div class="brand">오늘도수학 숙제, ${isAdmin()?'관리자':'선생님'} ${esc(Te.me.name)}</div>
   <div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}<button data-tab="ref">새로고침</button><button data-tab="out">로그아웃</button></div></div>`;
  if(Te.note) return nav+noteHTML();
  if(!Te.d) return nav+'<div class="meta">불러오는 중이에요...</div>';
  return nav+(tab==='hw'?tHw():tab==='st'?tSt():tab==='bk'?tBk():tab==='sf'&&isAdmin()?tSf():tHs());
}

function tDetail(aid){

function tStudentPanel(a,sid){

  if(!a.book_id) return `<h2 style="margin-top:6px">${esc(sName(sid))} <small>${s.result.ok} / ${s.result.tot}</small></h2><div class="meta">교재를 정리해서 점수와 정답률만 남아 있어요.</div>`;
  const g=Te.grade; if(!g||g.key!==a.id+'|'+sid) return `<div class="meta">채점 내용을 불러오는 중이에요...</div>`;
  const rows=Object.keys(g.r).sort((x,y)=>x-y).map(n=>{const it=g.items[n]||{}; const v=g.r[n];

    const given=GRADED(it.type)?(g.answers[n]||'비워 둠'):(g.checked[n]?'풀었다고 체크':'체크 안 함');

   <div class="det" style="max-height:360px;overflow:auto">${rows}</div>
   <button class="btn sec" data-note="1">이 학생 오답 노트 만들기</button>${ov}`;

function countR(r){let ok=0,tot=0,chk=0;Object.values(r).forEach(v=>{if(v==='c')chk++;else{tot++;if(v==='o')ok++;}});return {ok,tot,chk};}
async function loadGrade(a,sid){
  const e=tEff(a,sid); const s=tSub(a,sid);
  const full=await must(sb.from('submissions').select('answers,checked,ov,result').eq('assignment_id',a.id).eq('student_id',sid).single());
  const its=await must(sb.from('items').select('num,tag,type,answer').eq('book_id',a.book_id).gte('num',e.from).lte('num',e.to));
  const items={}; its.forEach(i=>items[i.num]=i);
  Te.grade={key:a.id+'|'+sid,r:{...full.result.r},answers:full.answers,checked:full.checked,ov:full.ov||{},items};
}

async function buildNote(a,sid){

  Te.busy=true; toast('오답 노트를 만드는 중이에요...');
  const paths=[]; wrong.forEach(n=>{paths.push(`${a.book_id}/${n}.png`,`${a.book_id}/${n}_a.png`);});
  const res=await sb.storage.from('problems').createSignedUrls(paths,3600);
  const url={}; (res.data||[]).forEach(x=>{if(x.signedUrl)url[x.path]=x.signedUrl;});
  Te.note={a,sid,wrong,items:g.items,url}; Te.busy=false; render();
}

    <div class="fld">정답표 엑셀 (번호, 유형, 정답 열 필요. 출처코드 열은 있으면 같이 읽어요)<input id="bx" type="file" accept=".xlsx,.xls,.csv"></div>
    <div class="fld">문항 이미지 zip (001.png 처럼 번호로 된 문제 이미지, 해설이 있으면 001_해설.png)<input id="bz" type="file" accept=".zip"></div>
    <div class="meta">정답표와 이미지가 둘 다 있어야 올라가요. 번호가 서로 맞는지 확인해요. 올리는 데 몇 분 걸릴 수 있으니 창을 닫지 마세요.</div>
    <button class="btn" id="bgo">교재 올리기</button><div class="meta" id="bres">${esc(Te.msg)}</div></div></div>`;
}
async function uploadBook(){
  const say=m=>{Te.msg=m;const r=$('#bres');if(r)r.textContent=m;};
  const name=$('#bn').value.trim(), fx=$('#bx').files[0], fz=$('#bz').files[0];
  if(!name){say('교재 이름을 적어 주세요.');return;}
  if(!fx||!fz){say('정답표 엑셀과 문항 이미지 zip을 둘 다 올려 주세요. 이미지가 없으면 오답 노트를 만들 수 없어요.');return;}
  $('#bgo').disabled=true;
  try{
    say('엑셀을 읽는 중이에요...');
    const wb=XLSX.read(await fx.arrayBuffer(),{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    const hi=rows.findIndex(r=>r.some(c=>String(c).trim()==='번호')&&r.some(c=>String(c).trim()==='정답'));
    if(hi<0){say('엑셀 첫 줄에 번호, 정답 열 이름이 있어야 해요.');$('#bgo').disabled=false;return;}
    const h=rows[hi].map(c=>String(c).trim()), ci=k=>h.indexOf(k), items={};
    rows.slice(hi+1).forEach(r=>{const n=parseInt(r[ci('번호')]); if(!n)return; const ans=String(r[ci('정답')]??'').trim();
      let type=ci('유형')>=0?String(r[ci('유형')]||'').trim():''; if(!type) type=/^[①②③④⑤]$/.test(ans)?'객관식':'단답';
      items[n]={num:n,tag:ci('출처코드')>=0?String(r[ci('출처코드')]||'').replace(/^-/,''):'',type,answer:ans};});
    const nums=Object.keys(items).map(Number); if(!nums.length){say('문항을 한 개도 못 읽었어요.');$('#bgo').disabled=false;return;}
    say('이미지 묶음을 읽는 중이에요...');
    const z=await JSZip.loadAsync(await fz.arrayBuffer()); const prob={}, sol={};
    Object.values(z.files).forEach(f=>{ if(f.dir)return; const base=f.name.split('/').pop(); const m=base.match(/^(\d+)(_해설)?\.(png|jpe?g|webp)$/i); if(!m)return; (m[2]?sol:prob)[+m[1]]=f; });
    const miss=nums.filter(n=>!prob[n]), extra=Object.keys(prob).map(Number).filter(n=>!items[n]);
    if(miss.length||extra.length){say(`번호가 서로 맞지 않아 올리지 않았어요. 이미지가 없는 번호: ${miss.slice(0,15).join(', ')||'없음'} / 정답표에 없는 이미지 번호: ${extra.slice(0,15).join(', ')||'없음'}`);$('#bgo').disabled=false;return;}
    const book=(await must(sb.from('books').insert({name}).select().single()));
    const total=nums.length; let done=0;
    await must(sb.from('items').insert(nums.map(n=>({book_id:book.id,num:n,tag:items[n].tag,type:items[n].type,answer:items[n].answer}))));
    const jobs=[]; nums.forEach(n=>{jobs.push(['p',n]); if(sol[n]) jobs.push(['s',n]);});
    let idx=0;
    const worker=async()=>{ while(idx<jobs.length){ const [k,n]=jobs[idx++]; const f=(k==='p'?prob:sol)[n]; const blob=await f.async('blob');
      const path=`${book.id}/${n}${k==='s'?'_a':''}.png`;
      const r=await sb.storage.from('problems').upload(path,blob,{contentType:'image/png',upsert:true}); if(r.error) throw r.error;
      done++; if(done%10===0||done===jobs.length) say(`이미지를 올리는 중이에요... ${done} / ${jobs.length}`); } };
    await Promise.all([worker(),worker(),worker(),worker()]);
    say(`${name}: ${total}문항을 올렸어요.`); toast('교재를 올렸어요.'); await teacherLoad(); render();
  }catch(e){ say('올리는 중 문제가 생겼어요: '+errMsg(e)); const b=$('#bgo'); if(b)b.disabled=false; }
}
async function removeBook(id){
  try{
    const list=await sb.storage.from('problems').list(id,{limit:2000});
    const files=(list.data||[]).map(f=>`${id}/${f.name}`);
    for(let i=0;i<files.length;i+=100) await sb.storage.from('problems').remove(files.slice(i,i+100));
    await must(sb.rpc('staff_delete_book',{p_book:id}));
    Te.delbook=null; await teacherLoad(); render(); toast('교재를 지웠어요. 숙제 이력과 정답률은 그대로예요.');
  }catch(e){ toast(errMsg(e)); }
}
/* --- 이력 --- */
function tHs(){
  const d=Te.d;
  const rows=d.students.map(s=>{
    let n=0,dn=0,ok=0,tot=0;
    d.assignments.forEach(a=>{ if(!tTargets(a).includes(s.id)) return; n++; const sub=tSub(a,s.id); if(sub&&sub.done){dn++; ok+=sub.result.ok; tot+=sub.result.tot;} });
    return `<tr><td>${esc(cName(s.class_id))}</td><td>${esc(s.name)}</td><td>${dn} / ${n}</td><td>${n?Math.round(dn*100/n)+'%':''}</td><td>${tot?Math.round(ok*100/tot)+'%':''}</td></tr>`;}).join('');
  const m=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}).slice(0,7);
  const used=d.exts.filter(e=>e.month===m).map(e=>sName(e.student_id));
  return `<div class="grid"><div class="panel"><h2>학생별 이력<small>교재를 지워도 남아요</small></h2><div class="tw"><table><thead><tr><th>반</th><th>학생</th><th>제출</th><th>완수율</th><th>정답률</th></tr></thead><tbody>${rows||'<tr><td colspan="5">학생이 없어요.</td></tr>'}</tbody></table></div></div>
   <div class="panel"><h2>이번 달 미루기를 쓴 학생</h2><div>${used.length?used.map(esc).join(', '):'<span class="meta">없어요.</span>'}</div></div></div>`;
}

async function doLogin(){
  const err=$('#lerr'); err.textContent='';
  try{
    if(A.login==='student'){
      const r=await must(sb.rpc('student_login',{p_name:$('#ln').value,p_pin:$('#lp').value}));
      St.token=r.token; St.name=r.name; St.cls=r.class_name; localStorage.setItem('odm_token',r.token); localStorage.setItem('odm_name',r.name); localStorage.setItem('odm_cls',r.class_name);
      mode='student'; St.screen='home'; await studentHome(); render();
    } else if(A.tmode==='up'){
      const r=await sb.auth.signUp({email:$('#le').value.trim(),password:$('#lw').value});
      if(r.error){err.textContent=/registered|exists/i.test(r.error.message)?'이미 가입한 이메일이에요. "이미 가입했어요"로 로그인해 주세요.':'가입하지 못했어요: '+r.error.message;return;}
      if(!r.data.session){err.textContent='확인 메일을 보냈어요. 메일의 링크를 누른 뒤 "이미 가입했어요"로 로그인하고 초대 코드를 넣어 주세요.';return;}
      await must(sb.rpc('claim_staff',{p_code:$('#lc').value}));
      mode='teacher'; await teacherLoad(); render();
    } else {
      const r=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lw').value});
      if(r.error){err.textContent='이메일이나 비밀번호가 맞지 않아요.';return;}
      mode='teacher'; await teacherLoad(); render();
    }
  }catch(e){ err.textContent=errMsg(e); }
}
async function newHw(){
  const d=Te.d; const bookId=$('#nb').value; const book=d.books.find(b=>b.id===bookId);
  const f=+$('#nf').value, t=+$('#nt').value, max=book?book.count:0;
  if(!book||!f||!t||f>t||t>max){toast(`번호를 확인해 주세요. 이 교재는 1~${max}번이에요.`);return;}
  const cls=$$('[name=nc]:checked').map(i=>i.value), sel=[...$('#ns').selectedOptions].map(o=>o.value);
  if(!cls.length&&!sel.length){toast('반이나 학생을 하나 이상 골라 주세요.');return;}
  const date=$('#nd').value||seoulToday();
  try{
    const a=await must(sb.from('assignments').insert({book_id:book.id,book_name:book.name,from_num:f,to_num:t,due:midnightOf(date),title:`${book.name} ${f}~${t}번`}).select().single());
    const rows=cls.map(c=>({assignment_id:a.id,class_id:c})).concat(sel.map(s=>({assignment_id:a.id,student_id:s})));
    await must(sb.from('assignment_targets').insert(rows));
    await teacherLoad(); Te.aid=a.id; Te.sid=null; render(); toast('숙제를 냈어요. 학생 폰에서 바로 보여요.');
  }catch(e){ toast(errMsg(e)); }
}
async function toggleGrade(n){
  const a=Te.d.assignments.find(x=>x.id===Te.aid), sid=Te.sid, g=Te.grade; if(!g) return;
  g.r[n]= g.r[n]==='o'?'x':'o'; g.ov[n]=g.r[n]; const c=countR(g.r);
  try{
    await must(sb.from('submissions').update({result:{r:g.r,ok:c.ok,tot:c.tot,chk:c.chk},ov:g.ov}).eq('assignment_id',a.id).eq('student_id',sid));
    const s=tSub(a,sid); if(s) s.result={r:{...g.r},ok:c.ok,tot:c.tot,chk:c.chk}; render();
  }catch(e){ g.r[n]=g.r[n]==='o'?'x':'o'; toast(errMsg(e)); }
}
async function saveOverride(){
  const a=Te.d.assignments.find(x=>x.id===Te.aid), sid=Te.sid;
  const f=+$('#ofrom').value,t=+$('#oto').value; const book=Te.d.books.find(b=>b.id===a.book_id); const max=book?book.count:9999;
  if(!f||!t||f>t||t>max){toast('번호를 확인해 주세요.');return;}
  const dv=$('#odue').value;
  try{ await must(sb.from('overrides').upsert({assignment_id:a.id,student_id:sid,from_num:f,to_num:t,due:dv?midnightOf(dv):a.due})); await teacherLoad(); render(); toast(sName(sid)+' 학생만 바뀌었어요.'); }
  catch(e){ toast(errMsg(e)); }
}
async function addStudents(){
  const cls=$('#sc').value; const lines=$('#sl').value.split('\n').map(l=>l.trim()).filter(Boolean); const out=[]; let ok=0;
  if(!cls){toast('먼저 반을 만들어 주세요.');return;}
  for(const l of lines){ const m=l.match(/^(.+?)[\s,]+(\d{4,6})$/); if(!m){out.push(`"${l}" 형식이 맞지 않아요.`);continue;}
    try{ await must(sb.rpc('teacher_add_student',{p_name:m[1],p_class:cls,p_pin:m[2]})); ok++; }catch(e){ out.push(`${m[1]}: ${String(e.message).includes('duplicate')?'같은 이름이 이미 있어요.':errMsg(e)}`); } }
  await teacherLoad(); Te.tab='st'; render(); const r=$('#smsg'); if(r) r.textContent=`${ok}명을 추가했어요. ${out.join(' ')}`; toast(`${ok}명을 추가했어요.`);
}
async function refreshTeacher(manual){
  if(mode!=='teacher'||!Te.me||Te.busy) return;
  const el=document.activeElement;
  if(!manual && el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  if(Te.note) return;
  const keepSid=Te.sid, keepAid=Te.aid;
  await teacherLoad();
  if(keepAid && keepSid){ const a=Te.d.assignments.find(x=>x.id===keepAid); const sub=a&&tSub(a,keepSid); if(a&&sub&&sub.done&&a.book_id){ try{await loadGrade(a,keepSid);}catch(e){} } }
  render(); if(manual) toast('최신 내용으로 새로 불러왔어요.');
}
